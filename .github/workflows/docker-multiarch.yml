name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          GHCR="ghcr.io/${{ github.repository }}"
          HUB="skyledge/java-chamber"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag event: strip the leading 'v' for the Docker tag
            raw_tag="${GITHUB_REF#refs/tags/}"
            docker_tag="${raw_tag#v}"
            TAGS="${GHCR}:${docker_tag}"
            TAGS="${TAGS}"$'\n'"${GHCR}:${{ github.sha }}"
            TAGS="${TAGS}"$'\n'"${HUB}:${docker_tag}"
            TAGS="${TAGS}"$'\n'"${HUB}:latest"
          else
            # Branch event: use sanitized branch name
            ref="${GITHUB_REF#refs/heads/}"
            safe_ref=$(echo "$ref" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')
            TAGS="${GHCR}:latest"
            TAGS="${TAGS}"$'\n'"${GHCR}:${safe_ref}"
            TAGS="${TAGS}"$'\n'"${GHCR}:${{ github.sha }}"
          fi

          # Emit as a multiline output using heredoc delimiter
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
